[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="macropulse"
version="0.1.0"
requires-python=">=3.12"
dependencies=["fastapi>=0.115","pydantic>=2.8","httpx>=0.27","uvicorn>=0.30","sqlalchemy>=2.0","alembic>=1.13","psycopg[binary]>=3.1","streamlit>=1.37","plotly>=5.22"]

[project.optional-dependencies]
dev=["pytest>=8","ruff>=0.6"]

[tool.setuptools.packages.find]
where=["src"]

[tool.pytest.ini_options]
pythonpath=["src"]
